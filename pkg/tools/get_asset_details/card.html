<!doctype html>
<meta charset="utf-8">
<style>
  body { margin:0; font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#1b1b1f }
  .card { border:1px solid #e3e3e8; border-radius:10px; padding:14px 16px; max-width:520px }
  .type { font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:#6b6b76 }
  h1 { font-size:16px; margin:2px 0 8px }
  dl { display:grid; grid-template-columns:auto 1fr; gap:2px 12px; margin:0 }
  dt { color:#6b6b76 } dd { margin:0 }
  a { color:#0b5fff }
  .empty { color:#6b6b76 }
</style>
<div class="card" id="card"><span class="empty">Waiting for asset…</span></div>
<script>
  const card = document.getElementById("card");
  const esc = s => String(s ?? "").replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));

  function render(out) {
    if (!out || !out.found) { card.innerHTML = '<span class="empty">' + esc(out?.error || "Asset not found") + "</span>"; return; }
    const a = out.asset || {};
    const owners = (out.responsibilities || [])
      .map(r => esc(r.roleName) + ": " + esc(r.userName || r.groupName))
      .join("<br>") || '<span class="empty">none</span>';
    card.innerHTML =
      '<div class="type">' + esc(a.type?.name || a.typeName || "Asset") + "</div>" +
      "<h1>" + esc(a.displayName || a.name || "(unnamed)") + "</h1>" +
      "<dl>" +
        "<dt>Domain</dt><dd>" + esc(a.domain?.name || "—") + "</dd>" +
        "<dt>Status</dt><dd>" + esc(a.status?.name || "—") + "</dd>" +
        "<dt>Owners</dt><dd>" + owners + "</dd>" +
      "</dl>" +
      (out.link ? '<p><a href="' + esc(out.link) + '" target="_blank">Open in Collibra</a></p>' : "");
  }

  // Minimal MCP Apps postMessage client: handshake, then take the pushed result.
  let id = 0;
  const send = m => parent.postMessage({ jsonrpc: "2.0", ...m }, "*");
  window.addEventListener("message", e => {
    const m = e.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id === 1 && m.result) send({ method: "ui/notifications/initialized", params: {} });
    if (m.method === "ui/notifications/tool-result") render(m.params?.structuredContent);
  });
  send({
    id: ++id,
    method: "ui/initialize",
    params: {
      protocolVersion: "2026-01-26",
      appInfo: { name: "collibra-asset-card", version: "0.1.0" },
      appCapabilities: {},
    },
  });
</script>
