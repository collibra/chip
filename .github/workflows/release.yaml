name: release
run-name: release - ${{ github.ref_name }} - triggered by ${{ github.actor }}

on:
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve release version from version.go
        id: resolve
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "ERROR: Release must be dispatched from main, got ${{ github.ref_name }}"
            exit 1
          fi
          VERSION=$(sed -n 's/.*Version = "\(.*\)-SNAPSHOT".*/\1/p' pkg/chip/version.go)
          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not parse a -SNAPSHOT version from pkg/chip/version.go"
            exit 1
          fi
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null; then
            echo "ERROR: Tag ${TAG} already exists"
            exit 1
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

  build:
    needs: version
    uses: ./.github/workflows/build.yaml

  release:
    needs: [version, build]
    runs-on:
      - runs-on
      - run-id=${{ github.run_id }}
      - runner=md
      - env=production-eu
      - tag=build-${{ github.event.repository.name }}
    environment: Release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'

      - name: Install dependencies
        run: go mod download

      - name: Set version
        run: |
          echo "VERSION=${{ needs.version.outputs.version }}" >> $GITHUB_ENV

      - name: Test
        if: ${{ !contains(env.VERSION, '-') }} # Skip tests for pre-release versions (e.g., 1.0.0-beta) to avoid issues with version parsing in tests
        run: go test --tags release -run TestReleaseVersionCheck -v ./...

      # The tag is created only after the Release environment approval,
      # so a rejected run leaves no trace.
      - name: Create release tag
        run: |
          git tag "${{ needs.version.outputs.tag }}"
          git push origin "refs/tags/${{ needs.version.outputs.tag }}"

      - name: Setup Java 17
        run: |
          mkdir -p /tmp/chip-signing
          pushd /tmp/chip-signing
          wget -q https://corretto.aws/downloads/latest/amazon-corretto-17-x64-linux-jdk.tar.gz
          tar -xzf amazon-corretto-17-x64-linux-jdk.tar.gz
          JAVA_DIR=$(find . -maxdepth 1 -type d -name "amazon-corretto-*" -print -quit | sed 's|^\./||')
          echo "$PWD/$JAVA_DIR/bin" >> $GITHUB_PATH
          echo "Java 17 installed: $JAVA_DIR"
          popd

      - name: Download JSign
        run: |
          mkdir -p /tmp/chip-signing
          wget -q https://github.com/ebourg/jsign/releases/download/7.4/jsign-7.4.jar -O /tmp/chip-signing/jsign.jar
          echo "JSIGN_JAR_PATH=/tmp/chip-signing/jsign.jar" >> $GITHUB_ENV
          echo "JSign downloaded successfully"

      - name: Create certificate chain file
        run: |
          mkdir -p /tmp/chip-signing
          echo "${{ secrets.CODE_SIGNING_CERTIFICATE_CHAIN }}" > /tmp/chip-signing/signing_chain.pem
          if [ ! -s /tmp/chip-signing/signing_chain.pem ]; then
            echo "ERROR: CODE_SIGNING_CERTIFICATE_CHAIN secret is empty or not set"
            exit 1
          fi
          echo "CODE_SIGNING_CERT_CHAIN_FILE=/tmp/chip-signing/signing_chain.pem" >> $GITHUB_ENV
          echo "Certificate chain file created"

      # RunsOn workers have the CodeSigningPolicy attached, which grants
      # access to the KMS signing key via EC2 instance metadata (IMDSv2).
      - name: Configure AWS credentials
        run: |
          TOKEN=$(curl -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
          ROLE_NAME=$(curl -H "X-aws-ec2-metadata-token: $TOKEN" -s http://169.254.169.254/latest/meta-data/iam/security-credentials/)
          CREDENTIALS=$(curl -H "X-aws-ec2-metadata-token: $TOKEN" -s http://169.254.169.254/latest/meta-data/iam/security-credentials/$ROLE_NAME)

          ACCESS_KEY=$(echo $CREDENTIALS | jq -r .AccessKeyId)
          SECRET_KEY=$(echo $CREDENTIALS | jq -r .SecretAccessKey)
          SESSION_TOKEN=$(echo $CREDENTIALS | jq -r .Token)

          mkdir -p ~/.aws
          echo "[default]" > ~/.aws/credentials
          echo "aws_access_key_id = ${ACCESS_KEY}" >> ~/.aws/credentials
          echo "aws_secret_access_key = ${SECRET_KEY}" >> ~/.aws/credentials
          echo "aws_session_token = ${SESSION_TOKEN}" >> ~/.aws/credentials

          echo "[default]" > ~/.aws/config
          echo "region = ${{ vars.CODE_SIGNING_AWS_REGION || 'eu-west-1' }}" >> ~/.aws/config

          echo "AWS credentials configured successfully"

      - name: Set signing environment variables
        run: |
          echo "CODE_SIGNING_AWS_REGION=${{ vars.CODE_SIGNING_AWS_REGION || 'eu-west-1' }}" >> $GITHUB_ENV
          if [ -z "${{ secrets.KMS_SIGNING_KEY_ARN }}" ]; then
            echo "ERROR: KMS_SIGNING_KEY_ARN secret is not set"
            exit 1
          fi
          echo "KMS_SIGNING_KEY_ARN=${{ secrets.KMS_SIGNING_KEY_ARN }}" >> $GITHUB_ENV

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a  # v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --verbose
        env:
          GORELEASER_CURRENT_TAG: ${{ needs.version.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JSIGN_JAR_PATH: ${{ env.JSIGN_JAR_PATH }}
          CODE_SIGNING_CERT_CHAIN_FILE: ${{ env.CODE_SIGNING_CERT_CHAIN_FILE }}
          CODE_SIGNING_AWS_REGION: ${{ env.CODE_SIGNING_AWS_REGION }}
          KMS_SIGNING_KEY_ARN: ${{ env.KMS_SIGNING_KEY_ARN }}

      - name: Cleanup
        if: always()
        run: |
          rm -rf /tmp/chip-signing ~/.aws
          echo "Cleanup completed"

  chip-service-pr:
    needs: [version, release]
    if: ${{ !contains(needs.version.outputs.version, '-') }} # Don't propagate pre-release versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout chip-service
        uses: actions/checkout@v5
        with:
          repository: collibra/chip-service
          token: ${{ secrets.COLLIBRA_GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config --global user.name "collibra-cicd"
          git config --global user.email "collibra-cicd@users.noreply.github.com"

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.CICD_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.CICD_GPG_PASSPHRASE }}
          trust_level: 5
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Bump chip dependency
        env:
          TAG: ${{ needs.version.outputs.tag }}
          GOPRIVATE: github.com/collibra/*
        run: |
          git config --global url."https://x-access-token:${{ secrets.COLLIBRA_GITHUB_TOKEN }}@github.com/collibra".insteadOf "https://github.com/collibra"
          go get github.com/collibra/chip@${TAG}
          go mod tidy

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.COLLIBRA_GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git checkout -b auto-bump-chip-${TAG}
          git commit -S -am "chore: bump chip to ${TAG}"
          git push -u origin HEAD

          PR_URL=$(gh pr create \
            --title "chore: bump chip to ${TAG}" \
            --body "Triggered by chip release https://github.com/collibra/chip/actions/runs/${{ github.run_id }}" \
            --base main \
            --head auto-bump-chip-${TAG})

          gh pr merge --auto --merge "${PR_URL}"
          echo "PR_URL=${PR_URL}" >> $GITHUB_ENV

      - name: Auto review with collibra-cicd-auto-merge account
        if: ${{ secrets.COLLIBRA_GITHUB_CHIP_AUTOMERGE_TOKEN != '' }} # Skipped until the secret is configured
        env:
          GH_TOKEN: ${{ secrets.COLLIBRA_GITHUB_CHIP_AUTOMERGE_TOKEN }} # Different account - can not approve own pull request
        run: gh pr review "${PR_URL}" --approve -b "Automated review for chip dependency bump on release"

  bump-version:
    needs: [version, release]
    if: ${{ !contains(needs.version.outputs.version, '-') }} # Don't bump main for pre-release versions (e.g., 1.0.0-beta)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.COLLIBRA_GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config --global user.name "collibra-cicd"
          git config --global user.email "collibra-cicd@users.noreply.github.com"

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.CICD_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.CICD_GPG_PASSPHRASE }}
          trust_level: 5
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Bump version.go to next SNAPSHOT
        env:
          GH_TOKEN: ${{ secrets.COLLIBRA_GITHUB_TOKEN }}
        run: |
          RELEASED=${{ needs.version.outputs.version }}

          # Skip if main has moved past the released version (e.g., manual bump or newer release)
          if ! grep -q "\"${RELEASED}-SNAPSHOT\"" pkg/chip/version.go; then
            echo "version.go no longer matches ${RELEASED}-SNAPSHOT, skipping auto-bump"
            exit 0
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "$RELEASED"
          NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))-SNAPSHOT"
          sed -i "s/Version = \".*\"/Version = \"${NEXT}\"/" pkg/chip/version.go

          git checkout -b chore/bump-${NEXT}
          git commit -S -am "chore: bump version to ${NEXT}"
          git push -u origin HEAD

          PR_URL=$(gh pr create \
            --title "chore: bump version to ${NEXT}" \
            --body "Post-release bump after https://github.com/collibra/chip/actions/runs/${{ github.run_id }}" \
            --base main \
            --head chore/bump-${NEXT})

          gh pr merge --auto --merge "${PR_URL}"
          echo "PR_URL=${PR_URL}" >> $GITHUB_ENV

      - name: Auto review with collibra-cicd-auto-merge account
        if: ${{ secrets.COLLIBRA_GITHUB_CHIP_AUTOMERGE_TOKEN != '' }} # Skipped until the secret is configured
        env:
          GH_TOKEN: ${{ secrets.COLLIBRA_GITHUB_CHIP_AUTOMERGE_TOKEN }} # Different account - can not approve own pull request
        run: gh pr review "${PR_URL}" --approve -b "Automated review for post-release version bump"
